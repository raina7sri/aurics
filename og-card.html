<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aurics — OG card</title>
<style>
  :root{--midnight:#120D22;--violet:#5B44D4;--yellow:#F4CC48;--warm:#F8F5EC;--green:#3F8F4E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--midnight) 0%,#1d1240 55%,var(--violet) 100%);
    color:#fff;display:flex;flex-direction:column;justify-content:space-between;
    padding:64px 72px;position:relative}
  .rule{position:absolute;top:0;left:0;width:100%;height:6px;background:var(--yellow)}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800;
    letter-spacing:4px;text-transform:uppercase;color:var(--yellow)}
  .eyebrow .dot{width:14px;height:14px;background:var(--yellow)}
  h1{font-size:66px;line-height:1.08;letter-spacing:-1.8px;font-weight:700;
    margin-top:30px;max-width:1000px}
  p.deck{font-size:25px;line-height:1.45;color:rgba(255,255,255,.82);
    margin-top:22px;max-width:900px}
  .tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .tool{font-size:17px;font-weight:600;padding:10px 18px;
    border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.92)}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .domain{font-size:22px;font-weight:800;letter-spacing:.5px;color:#fff}
  .tag{font-size:17px;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
  <div class="rule"></div>

  <div>
    <div class="eyebrow"><span class="dot"></span>Aurics Lab</div>
    <h1>AI-Native GTM &amp; Marketing,<br>Built in the Open.</h1>
    <p class="deck">Free, open-source tools for measuring and improving how brands
      show up in AI-driven search and go-to-market.</p>
  </div>

  <div class="tools">
    <span class="tool">AI Visibility Scorecard</span>
    <span class="tool">Customer Response Engine</span>
    <span class="tool">Customer Proof AI Layer</span>
  </div>

  <div class="foot">
    <span class="domain">aurics.ai</span>
    <span class="tag">Any brand · any category · any stage</span>
  </div>
</body>
</html>
